name: Minusbot YouTube TV

on:
  push:
    branches: [main, develop]
    paths:
      - 'skills/youtubetv/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.env.example'
  pull_request:
    branches: [main, develop]
    paths:
      - 'skills/youtubetv/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.env.example'
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test level: unit, integration, or all'
        required: false
        default: 'all'
        type: choice
        options:
          - unit
          - integration
          - all
      test_coverage:
        description: 'Enable test coverage report'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.12'
  LOG_LEVEL: 'INFO'
  TEST_LEVEL: 'all'

jobs:
  setup:
    name: Setup & Analysis
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.analysis.outputs.run_tests }}
      coverage_enabled: ${{ steps.analysis.outputs.coverage_enabled }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Analyze changes
        id: analysis
        run: |
          echo "Analyzing changes..."
          
          # Check if test files were modified
          if [ "${{ github.event_name }}" == "push" ]; then
            changed_files=$(git diff --name-only ${{ github.event.before }}..${{ github.event.after }})
          else
            changed_files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          fi
          
          # Determine if we should run tests
          has_changes=$(echo "$changed_files" | grep -c 'skills/youtubetv')
          if [ "$has_changes" -gt 0 ]; then
            echo "run_tests=true" >> $GITHUB_OUTPUT
          else
            echo "run_tests=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if coverage was requested
          if [ "${{ github.event.inputs.test_coverage }}" == "true" ]; then
            echo "coverage_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "coverage_enabled=false" >> $GITHUB_OUTPUT
          fi

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        if: needs.setup.outputs.run_tests == 'true'
        run: pip install ruff black mypy

      - name: Check formatting (black)
        if: needs.setup.outputs.run_tests == 'true'
        working-directory: skills/youtubetv/scripts
        run: black --check .

      - name: Run linter (ruff)
        if: needs.setup.outputs.run_tests == 'true'
        working-directory: skills/youtubetv/scripts
        run: |
          ruff check .
          ruff format --check .

      - name: Type checking (mypy)
        if: needs.setup.outputs.run_tests == 'true'
        working-directory: skills/youtubetv/scripts
        run: mypy wrapper.py logging_utils.py --ignore-missing-imports --no-error-summary

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [setup, lint]
    if: needs.setup.outputs.run_tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: skills/youtubetv/scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-cov

      - name: Run unit tests
        working-directory: skills/youtubetv/scripts
        env:
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
          TEST_LEVEL: unit
        run: |
          if [ "${{ github.event.inputs.test_coverage }}" == "true" ]; then
            pytest -v --cov=. --cov-report=xml --cov-report=term --tb=short
          else
            pytest -v --tb=short
          fi

      - name: Upload coverage report
        if: github.event.inputs.test_coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-youtubetv-${{ github.run_id }}
          path: coverage.xml
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-youtubetv-${{ github.run_id }}
          path: |
            *.txt
          retention-days: 7

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [setup, lint]
    if: needs.setup.outputs.run_tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: skills/youtubetv/scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run integration tests
        working-directory: skills/youtubetv/scripts
        env:
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
          TEST_LEVEL: integration
        run: |
          if [ -f "test_integration.py" ]; then
            pytest -v test_integration.py --tb=short
          else
            echo "No integration tests found"
          fi

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: [setup, lint]
    if: needs.setup.outputs.run_tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: pip install pydoclint sphinx

      - name: Check docstrings
        working-directory: skills/youtubetv/scripts
        run: |
          pydoclint wrapper.py logging_utils.py --style=google || echo "Docstrings may need improvement"

      - name: Generate API docs
        run: |
          mkdir -p docs
          sphinx-apidoc -o docs/ ../skills/youtubetv/scripts/
          echo "Documentation generated"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [setup, lint]
    if: needs.setup.outputs.run_tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install safety bandit

      - name: Run security checks
        working-directory: skills/youtubetv/scripts
        run: |
          safety check --full-report
          bandit -r . -f json -o security-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-youtubetv-${{ github.run_id }}
          path: security-report.json
          retention-days: 7

  publish-coverage:
    name: Publish Coverage
    runs-on: ubuntu-latest
    needs: test-unit
    if: github.event.inputs.test_coverage == 'true' && needs.test-unit.result == 'success'
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-youtubetv-${{ github.run_id }}

      - name: Upload to codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: youtubetv
          name: youtubetv-coverage

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, docs, security]
    if: always()
    steps:
      - name: Check status
        run: |
          echo "Test Unit: ${{ needs.test-unit.result }}"
          echo "Test Integration: ${{ needs.test-integration.result }}"
          echo "Docs: ${{ needs.docs.result }}"
          echo "Security: ${{ needs.security.result }}"
          
          if [ "${{ needs.test-unit.result }}" == "success" ] && [ "${{ needs.test-integration.result }}" == "success" ] && [ "${{ needs.docs.result }}" == "success" ] && [ "${{ needs.security.result }}" == "success" ]; then
            echo "🎉 All checks passed!"
            exit 0
          else
            echo "⚠️ Some checks failed or skipped"
            exit 0  # Don't fail the pipeline
          fi

line-length = 100
target-version = "py310"

lint.select = ["E", "W", "F", "B", "C4", "ICN", "PL", "PYI", "RUF", "UP", "ASYNC", "BLE", "DTZ", "EXE", "G", "ISC", "PIE", "PL", "PT", "PYI", "RUF", "SIM", "TCH", "UP", "YTT"]
lint.ignore = ["PLR", "B028"]

format.skip-magic-trailing-comma = false
format.docstring-code-format = true

[workspace]
resolver = "2"
members = [
    "crates/minus-core",
    "crates/minus-db",
    "crates/minus-env",
    "crates/minus-vault",
    "crates/minus-policy",
    "crates/minus-scheduler",
    "crates/minus-memory",
    "crates/minus-skills",
    "crates/minus-tools",
    "crates/minus-providers",
    "crates/minus-agent",
    "crates/minus-runtime",
    "providers/minus-provider-openai",
    "providers/minus-provider-openrouter",
    "crates/minus-channels",
    "channels/minus-channel-unix",
    "crates/minus-integrations",
    "crates/minus-addons",
    "crates/minus-lua",
    "crates/minus-commands",
    "apps/minusd",
    "apps/minusc",
]

[workspace.dependencies]
tokio = { version = "1.32", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
toml = "0.8"
async-trait = "0.1"
rand = "0.8"
dirs = "5.0"
dotenvy = "0.15"
once_cell = "1.18"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.21"
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
rustyline = "12.0"
colored = "2.1"
cron = "0.12"
[workspace]
resolver = "2"
members = [
    "apps/minusc",
    "apps/minusd",
    "crates/minus-agent",
    "crates/minus-api",
    "crates/minus-commands",
    "crates/minus-db",
    "crates/minus-env",
    "crates/minus-policy",
    "crates/minus-providers",
    "crates/minus-runtime",
    "crates/minus-scheduler",
    "crates/minus-skills",
    "crates/minus-tools",
    "crates/minus-vault",
    "channels/minus-channel-cli",
    "channels/minus-channel-telegram",
    "providers/minus-provider-openai",
    "providers/minus-provider-openrouter",
]

[workspace.dependencies]
tokio = { version = "1.32", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sqlx = { version = "0.7", features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "uuid",
    "macros",
] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
toml = "0.8"
async-trait = "0.1"
rand = "0.8"
dirs = "5.0"
dotenvy = "0.15"
once_cell = "1.18"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.21"
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
rustyline = "12.0"
colored = "2.1"
cron = "0.12"
machine-uid = "0.3"
